name: Build macOS apps
on:
  push:
    branches: [codex/macos-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-macos.txt 'pyinstaller==6.22.3' Pillow
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Verify platform adapters
        run: python -m unittest discover -s tests -v
      - name: Build app and verify ad-hoc signature
        run: python packaging/build_macos.py
      - name: Test real app on macOS
        run: python packaging/smoke_macos.py dist/VideoHunter.app
      - name: Package app
        run: |
          mkdir -p dist-macos
          ditto -c -k --sequesterRsrc --keepParent dist/VideoHunter.app dist-macos/VideoHunter-v1.1.0-beta.1-macOS-${{ matrix.arch }}.zip
          cp packaging/generated/smoke-test.json dist-macos/smoke-test-${{ matrix.arch }}.json
          cp MAC_README.md dist-macos/Mac-Readme-${{ matrix.arch }}.md
      - uses: actions/upload-artifact@v4
        with:
          name: VideoHunter-macOS-${{ matrix.arch }}
          path: dist-macos/*
          retention-days: 14
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-diagnostics-${{ matrix.arch }}
          path: |
            build/VideoHunter/warn-VideoHunter.txt
            packaging/generated/
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VideoHunter-macOS-*
          path: release-files
          merge-multiple: true
      - name: Create tested Mac prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-files
          sha256sum *.zip > SHA256SUMS-macOS.txt
          gh release create macos-v1.1.0-beta.1 ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title '影速獵手 macOS v1.1.0 測試版' --notes-file ../packaging/release-notes-macos.md
